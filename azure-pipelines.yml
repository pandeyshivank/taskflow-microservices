# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  branches:
    include:
      - main  # Or 'master', depending on your default branch name
pool:
  vmImage: 'windows-latest'

variables:
  vmImageName: 'windows-latest'
  
  # Change this to your exact Notification Service folder and project file name
  projectRoot: 'Backend/NotificationMicroService/NotificationMicroService.csproj'
  
  # Change this to your exact Azure App Service name for the notification service
  azureWebAppName: 'as-taskflow-NotificationService-dev'
  azureServiceConnection: 'MyAzureConnectionforCICD'

stages:
- stage: Build
  displayName: Build and Publish
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 9 SDK'
      inputs:
        packageType: 'sdk'
        version: '9.x' # Explicitly set to target .NET 9

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: '$(projectRoot)'

    - task: DotNetCoreCLI@2
      displayName: 'Build project'
      inputs:
        command: 'build'
        projects: '$(projectRoot)'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Publish project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(projectRoot)'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/App'

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/App'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    environment: 'Production'
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp' # Change to 'webAppLinux' if your App Service runs on Linux
              appName: '$(azureWebAppName)'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'


